spring.application.name=blue-hawk
spring.datasource.url=jdbc:mysql://localhost:3306/blue_hawk
spring.datasource.username=root
spring.datasource.password=everton130403

# Vamos voltar para o modo validate, garantindo que o Flyway é a unica fonte da verdade
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Desabilita a conversao automatica do Spring de CamelCase para snake_case
# Assim o Hibernate vai procurar exatamente "UserBoardGame" e nao "user_board_game"
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Respostas de erro no formato ProblemDetail (inclui a mensagem das ResponseStatusException).
spring.mvc.problemdetails.enabled=true

# JWT: chave fixa super secreta apenas para testes locais (no minimo 32 caracteres)
security.jwt.secret=9a3f4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a
security.jwt.expiration-seconds=86400
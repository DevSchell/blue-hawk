# Copie este arquivo para application.properties (ignorado pelo Git) e ajuste os valores.
spring.application.name=blue-hawk

# Configurações do PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sua_senha_aqui}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Desabilita a conversão de CamelCase para snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ProblemDetails
spring.mvc.problemdetails.enabled=true

# JWT (gere um segredo próprio com 32+ caracteres; não use este valor fora do ambiente local)
security.jwt.secret=${JWT_SECRET:troque-por-um-segredo-com-pelo-menos-32-caracteres}
security.jwt.expiration-seconds=86400
